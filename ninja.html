<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Ninja: Misi Bilangan Bulat</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MediaPipe Libraries (Stable versions) -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    
    <!-- Canvas Confetti untuk efek menang -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');

        body {
            font-family: 'Fredoka', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #0f172a; /* Fallback color */
        }

        /* Glassmorphism Styles */
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* Kamera dan Canvas Fullscreen */
        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* PENTING: Jangan gunakan scaleX(-1) di sini, biarkan MediaPipe selfieMode yang mengurusnya */
        #output_canvas, #video_element {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            top: 0;
            left: 0;
        }
        
        #video_element {
            display: none; /* Sembunyikan elemen video asli, kita hanya butuh canvas */
        }

        /* UI Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none; /* Agar klik tembus ke bawah jika perlu, meski kita pakai deteksi gerak */
        }

        /* Animasi */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); transform: scale(1); }
            50% { box-shadow: 0 0 40px rgba(59, 130, 246, 0.9); transform: scale(1.02); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-2deg); }
            50% { transform: translateX(10px) rotate(2deg); }
            75% { transform: translateX(-10px) rotate(-2deg); }
        }

        .anim-pulse {
            animation: pulse-glow 2s infinite ease-in-out;
        }
        
        .anim-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            border-color: #ef4444 !important; /* Merah saat salah */
            background: rgba(239, 68, 68, 0.3) !important;
        }

        .anim-success {
            border-color: #22c55e !important;
            background: rgba(34, 197, 94, 0.4) !important;
        }

        /* Kotak Jawaban (Hitbox) */
        .answer-box {
            pointer-events: auto; /* Bisa diklik dengan mouse untuk testing */
            transition: all 0.3s ease;
        }

        /* Tombol interaktif untuk mouse (opsional) */
        .interactive-btn {
            pointer-events: auto;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .interactive-btn:hover {
            transform: scale(1.05);
        }
        .interactive-btn:active {
            transform: scale(0.95);
        }
        
        .fire-text {
            background: linear-gradient(to right, #ff4e50, #f9d423);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="text-white overflow-hidden">

    <!-- Kontainer Media (Background AI) -->
    <div id="video-container">
        <video id="video_element" playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <!-- Kontainer UI Utama -->
    <div id="ui-layer" class="flex flex-col justify-between p-4 sm:p-8">
        
        <!-- Header (HUD) -->
        <div id="hud" class="hidden flex-row justify-between items-start w-full">
            <div class="glass-panel p-4 rounded-2xl flex flex-col items-center min-w-[120px]">
                <span class="text-sm text-gray-300 font-bold tracking-wider">SKOR NINJA</span>
                <span id="score-display" class="text-4xl font-bold text-yellow-400">0</span>
                <div id="combo-display" class="mt-1 text-sm font-bold opacity-0 transition-opacity duration-300 fire-text">🔥 COMBO x2</div>
            </div>
            
            <div class="glass-panel p-4 rounded-2xl flex flex-col items-center min-w-[120px]">
                <span class="text-sm text-gray-300 font-bold tracking-wider">MISI</span>
                <span class="text-3xl font-bold"><span id="question-current">1</span> <span class="text-xl text-gray-400">/ <span id="question-total">20</span></span></span>
            </div>
        </div>

        <!-- Papan Soal Tengah -->
        <div id="question-board" class="hidden flex-col items-center justify-center absolute top-1/4 left-1/2 transform -translate-x-1/2 w-[90%] max-w-3xl">
            <div id="question-container" class="glass-panel w-full p-6 sm:p-10 rounded-3xl text-center anim-pulse border-4 border-blue-500">
                <p class="text-lg sm:text-2xl text-blue-200 mb-2 font-bold" id="question-desc">Hitunglah:</p>
                <h1 class="text-4xl sm:text-6xl md:text-7xl font-bold text-white tracking-wide" id="question-text">-3 + 5 = ?</h1>
            </div>
            <!-- Feedback Overlay -->
            <div id="feedback-overlay" class="absolute inset-0 flex items-center justify-center opacity-0 transition-opacity duration-300">
                <span id="feedback-text" class="text-5xl md:text-7xl font-bold drop-shadow-2xl">Tepat Sekali! 💥</span>
            </div>
        </div>

        <!-- Area Jawaban Kiri & Kanan (Bottom) -->
        <div id="answers-area" class="hidden flex-row justify-between w-full absolute bottom-8 left-0 px-4 sm:px-12 pointer-events-none">
            <!-- Box Kiri -->
            <div id="box-left" class="answer-box bg-red-500 bg-opacity-80 border-4 border-red-300 rounded-3xl w-40 h-40 sm:w-56 sm:h-48 md:w-64 md:h-56 flex items-center justify-center shadow-[0_0_30px_rgba(239,68,68,0.6)]">
                <span class="text-5xl sm:text-6xl md:text-7xl font-bold text-white drop-shadow-lg" id="ans-text-left">-8</span>
            </div>
            
            <!-- Box Kanan -->
            <div id="box-right" class="answer-box bg-green-500 bg-opacity-80 border-4 border-green-300 rounded-3xl w-40 h-40 sm:w-56 sm:h-48 md:w-64 md:h-56 flex items-center justify-center shadow-[0_0_30px_rgba(34,197,94,0.6)]">
                <span class="text-5xl sm:text-6xl md:text-7xl font-bold text-white drop-shadow-lg" id="ans-text-right">2</span>
            </div>
        </div>

        <!-- Main Menu -->
        <div id="main-menu" class="absolute inset-0 flex flex-col items-center justify-center z-50 bg-slate-900 bg-opacity-80 backdrop-blur-md">
            <h1 class="text-5xl md:text-7xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-4 text-center px-4 drop-shadow-lg">
                MATH NINJA
            </h1>
            <h2 class="text-2xl text-blue-200 mb-12">Misi Bilangan Bulat</h2>
            
            <div id="loading-ai" class="hidden flex-col items-center mb-8">
                <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                <p class="text-blue-300 animate-pulse">Menghidupkan Sensor AI Kamera...</p>
            </div>

            <div class="flex flex-col gap-4 w-64">
                <button id="btn-start" class="interactive-btn py-4 px-6 bg-gradient-to-r from-blue-600 to-blue-500 rounded-2xl font-bold text-xl shadow-lg shadow-blue-500/50 border border-blue-400 hover:from-blue-500 hover:to-blue-400">
                    Mulai Misi 🥷
                </button>
                <button id="btn-leaderboard" class="interactive-btn py-3 px-6 glass-panel rounded-2xl font-bold text-lg hover:bg-white/10">
                    🏆 Papan Peringkat
                </button>
                <button id="btn-teacher" class="interactive-btn py-3 px-6 glass-panel rounded-2xl font-bold text-lg text-gray-300 hover:bg-white/10 mt-4 border-dashed border-2">
                    👨‍🏫 Mode Guru
                </button>
            </div>
        </div>

        <!-- Modal Peringatan -->
        <div id="modal-alert" class="hidden absolute inset-0 flex items-center justify-center z-50 bg-black bg-opacity-70">
            <div class="glass-panel p-8 rounded-3xl max-w-md text-center">
                <h3 id="modal-title" class="text-2xl font-bold text-red-400 mb-4">Peringatan</h3>
                <p id="modal-msg" class="text-gray-200 mb-6">Pesan error di sini.</p>
                <button id="btn-close-modal" class="interactive-btn py-2 px-6 bg-blue-600 rounded-xl font-bold">Mengerti</button>
            </div>
        </div>
        
    </div>

    <script>
        /**
         * MATH NINJA: MISI BILANGAN BULAT
         * Game Edukasi Berbasis Motion Detection AI
         */

        // ==========================================
        // 1. DATA SOAL & KONFIGURASI
        // ==========================================
        const questionsList = [
            { q: "-3 + 5 = ?", a: 2, wrong: -8, desc: "Hitunglah:" },
            { q: "4 - 7 = ?", a: -3, wrong: 3, desc: "Hitunglah:" },
            { q: "-2 - 4 = ?", a: -6, wrong: 2, desc: "Hitunglah:" },
            { q: "5 + (-9) = ?", a: -4, wrong: 14, desc: "Hitunglah:" },
            { q: "-8 + (-3) = ?", a: -11, wrong: -5, desc: "Hitunglah:" },
            { q: "10 - (-5) = ?", a: 15, wrong: 5, desc: "Hitunglah:" },
            { q: "-7 - (-2) = ?", a: -5, wrong: -9, desc: "Hitunglah:" },
            { q: "3 x (-4) = ?", a: -12, wrong: 12, desc: "Hitunglah:" },
            { q: "-5 x (-6) = ?", a: 30, wrong: -30, desc: "Hitunglah:" },
            { q: "15 : (-3) = ?", a: -5, wrong: 5, desc: "Hitunglah:" },
            { q: "-24 : (-4) = ?", a: 6, wrong: -6, desc: "Hitunglah:" },
            { q: "(-2 x 3) + 4 = ?", a: -2, wrong: -10, desc: "Campuran:" },
            { q: "10 - (2 x -5) = ?", a: 20, wrong: 0, desc: "Campuran:" },
            { q: "Suhu awal 5°C, turun 8°C. Suhu sekarang?", a: "-3°C", wrong: "3°C", desc: "Soal Cerita:" },
            { q: "Penyelam di -10m. Naik 4m. Posisi?", a: "-6m", wrong: "-14m", desc: "Soal Cerita:" },
            { q: "-15 + 20 - 5 = ?", a: 0, wrong: -10, desc: "Hitunglah:" },
            { q: "(-8 : 2) x -3 = ?", a: 12, wrong: -12, desc: "Campuran:" },
            { q: "7 + (-3) - (-5) = ?", a: 9, wrong: -1, desc: "Campuran:" },
            { q: "-20 : (4 - 9) = ?", a: 4, wrong: -4, desc: "Campuran:" },
            { q: "-50 + 100 - (-25) = ?", a: 75, wrong: 25, desc: "🔥 BOSS LEVEL 🔥" }
        ];

        let CONFIG = {
            totalQuestions: 20,
            hoverTimeRequired: 1500, // milidetik (1.5 detik tahan tangan)
            pointsCorrect: 15,
            pointsWrong: -5,
            comboThreshold: 3 // 3 kali benar beruntun = combo ganda
        };

        // ==========================================
        // 2. STATE MANAGEMENT (Status Game)
        // ==========================================
        const state = {
            gameState: 'menu', // menu, playing, gameover
            currentQuestionIndex: 0,
            score: 0,
            streak: 0,
            gameQuestions: [],
            
            // Interaction State (Hitbox)
            hoveringBox: null, // 'left' atau 'right'
            hoverStartTime: 0,
            isProcessingAnswer: false, // cegah deteksi ganda
            
            // MediaPipe State
            isAIReady: false
        };

        // DOM Elements
        const DOM = {
            menu: document.getElementById('main-menu'),
            loading: document.getElementById('loading-ai'),
            btnStart: document.getElementById('btnStart'),
            hud: document.getElementById('hud'),
            board: document.getElementById('question-board'),
            answersArea: document.getElementById('answers-area'),
            
            qDesc: document.getElementById('question-desc'),
            qText: document.getElementById('question-text'),
            ansLeft: document.getElementById('ans-text-left'),
            ansRight: document.getElementById('ans-text-right'),
            boxLeft: document.getElementById('box-left'),
            boxRight: document.getElementById('box-right'),
            
            scoreDisplay: document.getElementById('score-display'),
            comboDisplay: document.getElementById('combo-display'),
            qCurrent: document.getElementById('question-current'),
            
            qContainer: document.getElementById('question-container'),
            feedbackOverlay: document.getElementById('feedback-overlay'),
            feedbackText: document.getElementById('feedback-text'),
            
            video: document.getElementById('video_element'),
            canvasOut: document.getElementById('output_canvas'),
            ctxOut: document.getElementById('output_canvas').getContext('2d'),
            
            modalAlert: document.getElementById('modal-alert'),
            modalTitle: document.getElementById('modal-title'),
            modalMsg: document.getElementById('modal-msg')
        };

        let pose, camera;

        // ==========================================
        // 3. SISTEM AUDIO (Web Audio API - Offline)
        // ==========================================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const SFX = {
            correct: () => { playTone(600, 'sine', 0.1); setTimeout(() => playTone(800, 'sine', 0.2), 100); },
            wrong: () => playTone(200, 'sawtooth', 0.3),
            hover: () => playTone(400, 'triangle', 0.05),
            start: () => { playTone(400, 'square', 0.1); setTimeout(() => playTone(600, 'square', 0.2), 150); }
        };

        // ==========================================
        // 4. LOGIKA GAMEPLAY UTAMA
        // ==========================================
        
        function initGame() {
            // Ambil soal sesuai jumlah config
            state.gameQuestions = [...questionsList].slice(0, CONFIG.totalQuestions);
            state.currentQuestionIndex = 0;
            state.score = 0;
            state.streak = 0;
            state.gameState = 'playing';
            
            updateHUD();
            DOM.menu.classList.add('hidden');
            DOM.hud.classList.remove('hidden');
            DOM.board.classList.remove('hidden');
            DOM.answersArea.classList.remove('hidden');
            DOM.answersArea.classList.add('flex');
            
            SFX.start();
            loadQuestion();
        }

        function loadQuestion() {
            state.isProcessingAnswer = false;
            state.hoveringBox = null;
            
            const q = state.gameQuestions[state.currentQuestionIndex];
            DOM.qDesc.textContent = q.desc;
            DOM.qText.textContent = q.q;
            
            DOM.qContainer.className = "glass-panel w-full p-6 sm:p-10 rounded-3xl text-center border-4 border-blue-500 anim-pulse";
            DOM.feedbackOverlay.style.opacity = '0';
            
            // Acak posisi jawaban
            const isLeftCorrect = Math.random() > 0.5;
            state.currentCorrectBox = isLeftCorrect ? 'left' : 'right';
            
            if(isLeftCorrect) {
                DOM.ansLeft.textContent = q.a;
                DOM.ansRight.textContent = q.wrong;
            } else {
                DOM.ansLeft.textContent = q.wrong;
                DOM.ansRight.textContent = q.a;
            }
            
            DOM.qCurrent.textContent = state.currentQuestionIndex + 1;
        }

        function checkAnswer(selectedBox) {
            if(state.isProcessingAnswer) return;
            state.isProcessingAnswer = true;
            
            const isCorrect = (selectedBox === state.currentCorrectBox);
            
            // Hentikan animasi pulse soal
            DOM.qContainer.classList.remove('anim-pulse');
            
            if(isCorrect) {
                // BENAR
                SFX.correct();
                state.streak++;
                let pts = CONFIG.pointsCorrect;
                
                if(state.streak >= CONFIG.comboThreshold) {
                    pts *= 2; // Combo ganda
                    DOM.comboDisplay.classList.remove('opacity-0');
                    DOM.comboDisplay.textContent = `🔥 COMBO x${state.streak}! (+${pts})`;
                }
                state.score += pts;
                
                // Visuals
                DOM.qContainer.classList.add('anim-success');
                DOM.feedbackText.textContent = "Tepat Sekali! 💥";
                DOM.feedbackText.className = "text-5xl md:text-7xl font-bold text-green-400 drop-shadow-[0_0_15px_rgba(34,197,94,0.8)]";
                DOM.feedbackOverlay.style.opacity = '1';
                
                // Panggil confetti
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#26ccff', '#a25afd', '#ff5e7e', '#88ff5a', '#fcff42']
                });

            } else {
                // SALAH
                SFX.wrong();
                state.streak = 0;
                state.score += CONFIG.pointsWrong;
                DOM.comboDisplay.classList.add('opacity-0');
                
                // Visuals
                DOM.qContainer.classList.add('anim-shake');
                DOM.feedbackText.textContent = "Coba Lagi! ❌";
                DOM.feedbackText.className = "text-5xl md:text-7xl font-bold text-red-400 drop-shadow-[0_0_15px_rgba(239,68,68,0.8)]";
                DOM.feedbackOverlay.style.opacity = '1';
            }
            
            updateHUD();
            
            // Lanjut soal atau selesai
            setTimeout(() => {
                state.currentQuestionIndex++;
                if(state.currentQuestionIndex < state.gameQuestions.length) {
                    loadQuestion();
                } else {
                    endGame();
                }
            }, 2000); // Tunggu 2 detik baca feedback
        }

        function updateHUD() {
            DOM.scoreDisplay.textContent = state.score;
        }

        function endGame() {
            state.gameState = 'gameover';
            DOM.board.classList.add('hidden');
            DOM.answersArea.classList.remove('flex');
            DOM.answersArea.classList.add('hidden');
            DOM.hud.classList.add('hidden');
            
            DOM.menu.classList.remove('hidden');
            
            // Ubah tampilan menu jadi layar GameOver
            DOM.menu.innerHTML = `
                <div class="glass-panel p-10 rounded-3xl text-center max-w-lg w-[90%]">
                    <h1 class="text-5xl font-bold text-yellow-400 mb-2">MISI SELESAI!</h1>
                    <p class="text-xl text-gray-300 mb-6">Kamu telah menaklukkan bilangan bulat!</p>
                    
                    <div class="bg-black/30 rounded-2xl p-6 mb-8">
                        <span class="block text-gray-400 text-sm mb-1">TOTAL SKOR</span>
                        <span class="block text-6xl font-bold text-white mb-4">${state.score}</span>
                        <span class="text-lg text-emerald-400">🔥 Combo Tertinggi Tercapai!</span>
                    </div>
                    
                    <button onclick="location.reload()" class="interactive-btn py-4 px-8 bg-blue-600 rounded-2xl font-bold text-xl w-full">
                        Main Lagi 🔄
                    </button>
                </div>
            `;
            confetti({ particleCount: 200, spread: 100, origin: { y: 0.3 } });
        }

        function showAlert(title, msg) {
            DOM.modalTitle.textContent = title;
            DOM.modalMsg.textContent = msg;
            DOM.modalAlert.classList.remove('hidden');
        }
        document.getElementById('btn-close-modal').addEventListener('click', () => {
            DOM.modalAlert.classList.add('hidden');
        });

        // ==========================================
        // 5. SISTEM AI & KAMERA (MediaPipe)
        // ==========================================
        
        // Sesuaikan ukuran canvas internal dengan layar
        function resizeCanvas() {
            DOM.canvasOut.width = window.innerWidth;
            DOM.canvasOut.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        async function initAI() {
            try {
                DOM.btnStart.classList.add('hidden');
                DOM.loading.classList.remove('hidden');
                DOM.loading.classList.add('flex');
                
                // Pastikan class global MediaPipe tersedia
                if(typeof window.Pose === 'undefined') {
                    throw new Error("Library AI gagal dimuat. Pastikan koneksi internet stabil atau matikan AdBlocker sementara.");
                }

                // Inisialisasi Pose AI
                pose = new window.Pose({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`;
                    }
                });
                
                // KONFIGURASI PENTING: selfieMode: true
                // Ini secara otomatis membalikkan gambar dan koordinat kerangka layaknya cermin!
                pose.setOptions({
                    modelComplexity: 1, // Keseimbangan kecepatan & akurasi
                    smoothLandmarks: true,
                    enableSegmentation: false,
                    minDetectionConfidence: 0.6,
                    minTrackingConfidence: 0.6,
                    selfieMode: true 
                });
                
                pose.onResults(onPoseResults);
                
                // Muat model AI ke memori browser terlebih dahulu
                await pose.initialize();

                // Akses Kamera Web
                camera = new window.Camera(DOM.video, {
                    onFrame: async () => {
                        if (state.gameState !== 'gameover') {
                            await pose.send({image: DOM.video});
                        }
                    },
                    width: 1280,
                    height: 720
                });
                
                await camera.start();
                
                // Siap bermain
                state.isAIReady = true;
                initGame();

            } catch (error) {
                console.error(error);
                DOM.loading.classList.add('hidden');
                DOM.btnStart.classList.remove('hidden');
                
                // Deteksi jika masalah karena HTTP (Bukan HTTPS)
                if (window.location.protocol === 'http:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
                    showAlert("Kamera Diblokir!", "Situs web memerlukan koneksi HTTPS yang aman untuk mengakses kamera. Ubah URL browser Anda dari http:// menjadi https://");
                } else {
                    showAlert("Gagal Memulai AI", error.message || "Tolong izinkan akses kamera pada browser Anda untuk memainkan game ini.");
                }
            }
        }

        document.getElementById('btn-start').addEventListener('click', () => {
            // Mainkan dummy sound agar AudioContext diaktifkan oleh interaksi user (Syarat Browser)
            audioCtx.resume();
            initAI();
        });

        // ==========================================
        // 6. RENDER & DETEKSI FISIK WAKTU NYATA
        // ==========================================
        
        function onPoseResults(results) {
            // Jangan render jika belum masuk mode main
            if(state.gameState !== 'playing') return;

            const ctx = DOM.ctxOut;
            const w = DOM.canvasOut.width;
            const h = DOM.canvasOut.height;
            const now = performance.now();

            ctx.save();
            ctx.clearRect(0, 0, w, h);
            
            // 1. Gambar Background Video
            // Karena selfieMode = true, gambar results.image sudah dicerminkan secara otomatis
            ctx.drawImage(results.image, 0, 0, w, h);

            // 2. Analisis Titik Tubuh (Landmarks)
            if (results.poseLandmarks) {
                // Gambar garis kerangka neon
                window.drawConnectors(ctx, results.poseLandmarks, window.POSE_CONNECTIONS,
                               {color: '#00FF00', lineWidth: 2, opacity: 0.5});
                window.drawLandmarks(ctx, results.poseLandmarks,
                               {color: '#00BFFF', lineWidth: 1, radius: 3});

                // Ambil titik pergelangan tangan kiri (15) dan kanan (16)
                const leftWrist = results.poseLandmarks[15];
                const rightWrist = results.poseLandmarks[16];

                // Cek interaksi tangan dengan kotak jawaban
                let touchedBox = null;
                
                // Periksa tangan kanan (di layar, karena mirror, tangan kanan pemain akan muncul di kanan layar)
                if(checkHitbox(rightWrist, w, h, ctx)) {
                    touchedBox = checkHitbox(rightWrist, w, h, ctx);
                } 
                // Periksa tangan kiri
                else if (checkHitbox(leftWrist, w, h, ctx)) {
                    touchedBox = checkHitbox(leftWrist, w, h, ctx);
                }

                // Logika Hover (Progress Bar)
                if (touchedBox && !state.isProcessingAnswer) {
                    if (state.hoveringBox !== touchedBox) {
                        // Mulai sentuh kotak baru
                        state.hoveringBox = touchedBox;
                        state.hoverStartTime = now;
                        SFX.hover();
                    } else {
                        // Sedang menahan di kotak yang sama
                        const elapsed = now - state.hoverStartTime;
                        const progress = Math.min(elapsed / CONFIG.hoverTimeRequired, 1);
                        
                        // Gambar progress circle di layar (tengah bawah)
                        drawProgress(ctx, w/2, h - 100, progress, touchedBox);

                        if (progress >= 1) {
                            // Waktu hover tercapai -> KUNCI JAWABAN
                            checkAnswer(touchedBox);
                        }
                    }
                } else {
                    // Tangan keluar kotak
                    state.hoveringBox = null;
                }
            } else {
                // Tidak ada tubuh terdeteksi
                state.hoveringBox = null;
            }

            ctx.restore();
        }

        // Fungsi untuk mengecek tabrakan antara koordinat titik AI dengan elemen HTML
        function checkHitbox(landmark, canvasW, canvasH, ctx) {
            if (!landmark || landmark.visibility < 0.5) return null; // Abaikan jika tangan disembunyikan/tidak yakin

            // Kordinat MediaPipe adalah persentase (0 sampai 1)
            // Karena selfieMode: true, koordinat X sudah sesuai dengan letak di layar secara fisik
            const pointX = landmark.x * canvasW;
            const pointY = landmark.y * canvasH;

            // Gambar indikator neon di pergelangan tangan
            ctx.beginPath();
            ctx.arc(pointX, pointY, 15, 0, 2 * Math.PI);
            ctx.fillStyle = "rgba(255, 255, 0, 0.5)";
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = "yellow";
            ctx.stroke();

            // Cek posisi kotak Kiri
            const rectL = DOM.boxLeft.getBoundingClientRect();
            if (pointX >= rectL.left && pointX <= rectL.right &&
                pointY >= rectL.top && pointY <= rectL.bottom) {
                return 'left';
            }

            // Cek posisi kotak Kanan
            const rectR = DOM.boxRight.getBoundingClientRect();
            if (pointX >= rectR.left && pointX <= rectR.right &&
                pointY >= rectR.top && pointY <= rectR.bottom) {
                return 'right';
            }

            return null;
        }

        // Fungsi menggambar indikator loading bulat saat memilih jawaban
        function drawProgress(ctx, x, y, progress, boxName) {
            const radius = 40;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, 2 * Math.PI);
            ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
            ctx.fill();

            ctx.beginPath();
            ctx.arc(x, y, radius, -Math.PI / 2, (-Math.PI / 2) + (2 * Math.PI * progress));
            ctx.lineWidth = 10;
            ctx.strokeStyle = boxName === 'left' ? "#ef4444" : "#22c55e"; // merah atau hijau
            ctx.stroke();
            
            ctx.fillStyle = "white";
            ctx.font = "bold 20px Fredoka";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(`${Math.round(progress * 100)}%`, x, y);
        }

        // Dummy buttons alert (Papan Peringkat & Mode Guru)
        document.getElementById('btn-leaderboard').addEventListener('click', () => {
            showAlert("Papan Peringkat", "Fitur Leaderboard sedang dalam pengembangan. Kumpulkan skor tertinggimu terlebih dahulu!");
        });
        document.getElementById('btn-teacher').addEventListener('click', () => {
            showAlert("Mode Guru Terkunci", "Silakan masukkan PIN untuk mengatur waktu tunda (delay) dan daftar pertanyaan custom.");
        });

    </script>
